name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: node scripts/install-vercel.mjs

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Financial database tests
        run: npm run test:financial-db

      - name: Validate Vercel configuration
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-public-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          VITE_PUBLIC_SITE_URL: https://example.com
          VITE_STANDALONE_AUTH: "true"
          CRON_SECRET: ci-only-placeholder-secret-32-chars-minimum
          MERCADOPAGO_ACCESS_TOKEN: ci-mercadopago-access-token
          MERCADOPAGO_WEBHOOK_SECRET: ci-mercadopago-webhook-secret
          MELHOR_ENVIO_CLIENT_ID: "9000000"
          MELHOR_ENVIO_CLIENT_SECRET: ci-melhor-envio-client-secret
          MELHOR_ENVIO_REDIRECT_URI: https://example.com/api/melhor-envio/callback
          MELHOR_ENVIO_ENVIRONMENT: production
          MELHOR_ENVIO_OAUTH_STATE: ci-only-melhor-envio-oauth-state
        run: node scripts/check-vercel-env.mjs

      - name: Build
        run: npm run build
