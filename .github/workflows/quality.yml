name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: node scripts/install-vercel.mjs

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Financial database tests
        run: npm run test:financial-db

      - name: Build
        run: npm run build
